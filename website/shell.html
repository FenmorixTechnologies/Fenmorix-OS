<style>
:root {
  --navy: #08131D; --navy-2: #0F2234; --steel: #1B3147; --orange: #FF7900; --burnt: #C94D00; --arctic: #55CFFF;
  --silver: #C5CAD0; --frost: #EEF1F4; --ink: #0E1B28; --soft: #4D5A68; --line: #D6DCE3; --white: #fff;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; font-family: var(--body); font-size: 18px; line-height: 1.55; color: var(--ink); background: var(--frost); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--arctic); outline-offset: 3px; border-radius: 4px; }
.wrap { width: min(1180px, 100% - 32px); margin: 0 auto; }
h1, h2, h3 { font-family: var(--cond); line-height: 1.02; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: clamp(38px, 5vw, 60px); font-weight: 700; }
h3 { font-size: 26px; font-weight: 700; }
p { margin: 0 0 1em; max-width: 64ch; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 17px/1 var(--body); padding: 15px 22px; border-radius: 6px; text-decoration: none; cursor: pointer; border: 2px solid transparent; }
.btn-fire { background: var(--orange); color: #1A0B00; border-color: var(--orange); }
.btn-fire:hover { background: #FF8F2B; }
.btn-line { color: var(--white); border-color: #ffffff55; }
.btn-line:hover { border-color: var(--white); }

/* Header */
.top { position: absolute; inset: 0 0 auto; z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 28px; padding: 20px 0; }
.top img { height: 38px; display: block; }
.top nav { display: flex; gap: 22px; margin-left: auto; align-items: center; }
.top nav a { color: var(--silver); text-decoration: none; font-weight: 600; font-size: 16px; }
.top nav a:hover { color: var(--white); }
.top nav .btn { padding: 11px 16px; font-size: 15px; }
@media (max-width: 920px) { .top nav a.hide-sm { display: none; } }

<!--part:hero.css-->

/* Shift vignettes */
section.block { padding: 96px 0; }
.intro { display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: end; margin-bottom: 48px; }
.intro p { color: var(--soft); font-size: 19px; }
@media (max-width: 860px) { .intro { grid-template-columns: 1fr; gap: 16px; } }
.shift { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--line); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.moment { background: var(--white); padding: 30px; display: grid; grid-template-columns: 1fr; gap: 18px; align-content: start; }
.moment time { font: 800 34px/1 var(--cond); color: var(--burnt); }
.moment h3 { margin: 4px 0 8px; }
.moment p { color: var(--soft); font-size: 17px; margin: 0; }
@media (max-width: 860px) { .shift { grid-template-columns: 1fr; } }
/* little product fragments, drawn in HTML */
.frag { background: var(--frost); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 15px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.tag { font-weight: 700; font-size: 13px; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.ok { background: #DDF3E5; color: #17643A; } .warn { background: #FFE9D6; color: #8A3500; } .no { background: #FCE1DF; color: #8E1D14; } .idle { background: #E3E8EE; color: #3C4956; }
.par { display: flex; align-items: center; gap: 14px; }
.par strong { font: 800 46px/1 var(--cond); color: var(--ink); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain span { padding: 6px 10px; border-radius: 6px; background: var(--white); border: 1px solid var(--line); font-weight: 600; }
.chain span.done { border-color: #8FD3A9; background: #EEFAF2; }
.chain i { width: 14px; height: 2px; background: var(--line); display: inline-block; }
.score { display: flex; align-items: baseline; gap: 12px; }
.score strong { font: 800 52px/1 var(--cond); }
.bar { height: 10px; background: #DCE2E9; border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; width: 88%; background: linear-gradient(90deg, var(--burnt), var(--orange)); }

/* Business band */
.biz { background: var(--white); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.biz .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 36px; margin-top: 40px; }
.biz .cols div { border-top: 3px solid var(--ink); padding-top: 16px; }
.biz .cols p { color: var(--soft); font-size: 17px; }
@media (max-width: 860px) { .biz .cols { grid-template-columns: 1fr; } }

/* Security */
.secure { background: var(--navy); color: var(--white); }
.secure .intro p { color: #B9C3CE; }
.locks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid #23394F; }
.locks div { padding: 26px 24px 26px 0; border-bottom: 1px solid #23394F; }
.locks h3 { font-size: 23px; color: var(--white); margin-bottom: 6px; }
.locks p { color: #B9C3CE; font-size: 16.5px; margin: 0; }
@media (max-width: 860px) { .locks { grid-template-columns: 1fr; } }

/* Steps: a real sequence */
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; counter-reset: s; }
.steps li { counter-increment: s; border-left: 2px solid var(--orange); padding: 0 0 0 16px; }
.steps li::before { content: counter(s); font: 800 40px/1 var(--cond); color: var(--burnt); display: block; margin-bottom: 8px; }
.steps h3 { font-size: 23px; margin-bottom: 6px; }
.steps p { color: var(--soft); font-size: 16px; margin: 0; }
@media (max-width: 960px) { .steps { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

/* Pricing + hosting */
.terms { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.terms > div { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
.terms ul { margin: 14px 0 0; padding-left: 20px; color: var(--soft); }
.terms li { margin-bottom: 6px; }
@media (max-width: 860px) { .terms { grid-template-columns: 1fr; } }

/* Close */
.close { background: linear-gradient(120deg, var(--burnt), var(--orange)); color: #1A0B00; padding: 72px 0; }
.close .wrap { display: flex; gap: 32px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.close h2 { max-width: 16ch; }
.close .btn-dark { background: var(--navy); color: var(--white); border-color: var(--navy); }
.close .btn-ghost { color: #1A0B00; border-color: #1A0B0066; }
footer { background: var(--navy); color: #8C99A8; font-size: 15px; padding: 36px 0; }
footer .wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
footer img { height: 28px; }
footer nav { margin-left: auto; display: flex; gap: 18px; flex-wrap: wrap; }
footer a { color: var(--silver); text-decoration: none; }
footer a:hover { color: var(--white); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* Partner: Fenmorix x Avexon */
.partner { background: radial-gradient(55% 90% at 28% 45%, #FF79001F, transparent 70%), radial-gradient(55% 90% at 72% 45%, #24CE7B1A, transparent 70%), var(--navy); color: var(--white); padding: 88px 0 92px; text-align: center; border-top: 1px solid #1B3147; }
.partner .with { font: 600 15px var(--body); color: #8C99A8; margin: 0 auto; max-width: none; }
.lockup { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 48px); margin: 26px auto 34px; }
.lockup img { display: block; height: auto; }
.lockup .fx { width: min(330px, 62vw); }
.lockup .av { width: min(250px, 50vw); }
.cross { width: 58px; height: 58px; flex: none; position: relative; }
.cross svg { width: 100%; height: 100%; overflow: visible; }
.cross line { stroke-width: 7; stroke-linecap: round; stroke-dasharray: 72; stroke-dashoffset: 72; }
.cross .o { stroke: var(--orange); filter: drop-shadow(0 0 6px #FF7900B3); }
.cross .g { stroke: #24CE7B; filter: drop-shadow(0 0 6px #24CE7BB3); }
.partner.on .cross .o { animation: xdraw .7s .15s cubic-bezier(.3,.8,.2,1) forwards; }
.partner.on .cross .g { animation: xdraw .7s .55s cubic-bezier(.3,.8,.2,1) forwards; }
.partner.on .cross::after { content: ""; position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF59, transparent 60%); opacity: 0; animation: xflash 1s 1.1s ease-out; }
@keyframes xdraw { to { stroke-dashoffset: 0; } } @keyframes xflash { 30% { opacity: 1; } to { opacity: 0; } }
.lockup .fx, .lockup .av { opacity: 0; transform: translateX(var(--from)); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
.lockup .fx { --from: -24px; } .lockup .av { --from: 24px; }
.partner.on .lockup .fx, .partner.on .lockup .av { opacity: 1; transform: none; }
.partner h2 { font-size: clamp(32px, 4.6vw, 50px); font-style: italic; font-weight: 800; margin: 0 0 14px; text-wrap: balance; }
.partner h2 .o { color: var(--orange); } .partner h2 .g { color: #24CE7B; }
.partner p.say { color: #AEB8C3; max-width: 62ch; margin: 0 auto 26px; }
.partner .btn-green { background: #24CE7B; color: #04140B; border-color: #24CE7B; }
@media (max-width: 640px) { .lockup { flex-direction: column; gap: 14px; } .cross { width: 42px; height: 42px; } .lockup .fx, .lockup .av { --from: 0px; } }
@media (prefers-reduced-motion: reduce) { .cross line { stroke-dashoffset: 0; } .lockup .fx, .lockup .av { opacity: 1; transform: none; } }
<!--part:ideas.css-->
</style>

<script>
document.getElementById("demo-mail").addEventListener("click", e => {
  const b = window.fxBuild; if (!b) return;
  e.currentTarget.href = "mailto:michael@fenmorix.com?subject=" + encodeURIComponent("Fenmorix OS demo") + "&body=" + encodeURIComponent(`Our organization: ${b.name}\nType: ${b.sector}\nOur size (people):\nBest time to talk:\n\nModules we're interested in: ${b.modules.join(", ")}\n`);
});
document.getElementById("yr").textContent = new Date().getFullYear();
(() => { const pt = document.getElementById("partner"); if (!pt) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) { pt.classList.add("on"); return; }
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { pt.classList.add("on"); io.disconnect(); } }, { threshold: .35 }); io.observe(pt); })();
</script>
